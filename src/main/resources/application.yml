spring:
  application:
    name: SnmpAgent

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    root: INFO
    es:
      vodafone:
        sim:
          snmp: DEBUG
    org:
      snmp4j: TRACE

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs